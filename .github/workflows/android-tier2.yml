# Tier 2 — the instrumented tests, on an emulator (android/docs/testing.md).
#
# This was `workflow_dispatch` only until it had been seen to work here rather than on a developer's
# emulator. It has: first attempt, 5m55s, of which four minutes is the emulator booting. KVM is
# available on `ubuntu-latest`, a `google_apis` image exists for API 35, and the grant sequence
# behaves exactly as it does locally. So it now gates pull requests that touch `android/`.
#
# It is a separate workflow rather than another step in `android.yml` on purpose: tier 1 stays a
# ninety-second answer, and an emulator flake stays attributable to the emulator.
#
# Nothing here grants the accessibility service. The suite grants it to itself in
# `Tier2.awaitService`, because AGP uninstalls the application before installing the two APKs and a
# grant made earlier is dropped by the system along with the package.
name: Android tier 2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-tier2.yml"

permissions:
  contents: read

concurrency:
  group: android-tier2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  instrumented:
    runs-on: ubuntu-latest
    # The suite itself takes half a minute. Everything else is the emulator booting.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Without this the emulator falls back to software rendering and takes long enough to hit the
      # timeout above.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Everything in docs/testing.md was measured on API 37 locally; this image is what the
          # runner has, and the suite passes on both without knowing which it is on.
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --console=plain :app:connectedDebugAndroidTest
            echo "== what the tests measured"
            adb logcat -d -s Tier2:I
      - name: The report, when something failed
        if: failure()
        run: cat app/build/outputs/androidTest-results/connected/**/*.xml || true
