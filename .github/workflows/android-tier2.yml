# Tier 2 — the instrumented tests, on an emulator (android/docs/testing.md).
#
# **Dispatch only, and that is a decision rather than a gap.** This has been run here and it works:
# first attempt, 5m55s, of which four minutes is the emulator booting. `ubuntu-latest` has KVM, API 35
# has a `google_apis` image, and the grant sequence behaves exactly as it does locally — the runner's
# default AVD is even a tenth of the size (320 × 640) and the suite passed unchanged. So the reason it
# is not on `pull_request` is the six minutes, not doubt.
#
# What replaces it is the pull-request template, which asks for the output of `make tier2` from the
# machine the change was written on. A number somebody pasted is weaker than a green check and much
# stronger than nothing, and it costs no runner minutes at all. Turning the check back on is the two
# lines below this comment.
#
# Press *Run workflow* on the Actions tab when a change deserves it — anything touching the
# accessibility service, the runner, or gesture dispatch.
#
# Nothing here grants the accessibility service. The suite grants it to itself in
# `Tier2.awaitService`, because AGP uninstalls the application before installing the two APKs and a
# grant made earlier is dropped by the system along with the package.
name: Android tier 2

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "android/**"
  #     - ".github/workflows/android-tier2.yml"

permissions:
  contents: read

concurrency:
  group: android-tier2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  instrumented:
    runs-on: ubuntu-latest
    # The suite itself takes half a minute. Everything else is the emulator booting.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Without this the emulator falls back to software rendering and takes long enough to hit the
      # timeout above.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Everything in docs/testing.md was measured on API 37 locally; this image is what the
          # runner has, and the suite passes on both without knowing which it is on.
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --console=plain :app:connectedDebugAndroidTest
            echo "== what the tests measured"
            adb logcat -d -s Tier2:I
      - name: The report, when something failed
        if: failure()
        run: cat app/build/outputs/androidTest-results/connected/**/*.xml || true
