# Tier 2 — the instrumented tests, on an emulator (android/docs/testing.md).
#
# Manual for now, and the reason is worth stating rather than hiding: every line below has run on a
# local emulator and **none of it has run on a GitHub runner**. The emulator step, the API level and
# whether nested virtualisation is available on this runner class are the unverified parts. Wiring an
# unproven job into the gate that blocks pull requests would make the next unrelated change look
# broken, so this waits to be dispatched once, and moves into `android.yml` when it has passed.
#
# Nothing here grants the accessibility service. The suite grants it to itself in
# `Tier2.awaitService`, because AGP uninstalls the application before installing the two APKs and a
# grant made earlier is dropped by the system along with the package.
name: Android tier 2

on:
  workflow_dispatch:
  # TEMPORARY, and it comes out before this branch merges. `workflow_dispatch` only works for a
  # workflow that is already on the default branch, so there is no way to find out whether any of
  # this runs on a GitHub runner without a trigger that fires from the branch itself.
  push:
    branches:
      - test/tier-2-harness

permissions:
  contents: read

concurrency:
  group: android-tier2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  instrumented:
    runs-on: ubuntu-latest
    # The suite itself takes half a minute. Everything else is the emulator booting.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          build-root-directory: android
      # Without this the emulator falls back to software rendering and takes long enough to hit the
      # timeout above.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Everything in docs/testing.md was measured on API 37; 35 is what a runner is most likely
          # to have an image for. The first dispatch of this workflow is what settles that.
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --console=plain :app:connectedDebugAndroidTest
            echo "== what the tests measured"
            adb logcat -d -s Tier2:I
      - name: The report, when something failed
        if: failure()
        run: cat app/build/outputs/androidTest-results/connected/**/*.xml || true
