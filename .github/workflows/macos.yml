# The macOS app. Nothing here touches android/, so the path filter keeps an Android-only
# change from spending a macOS runner — the two platforms share documents, not code.
name: macOS

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  push:
    branches:
      - main
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: macos

jobs:
  build-and-test:
    # macos-26 is the image whose toolchain this is developed against. macos-15 ships Swift 6.0,
    # which is stricter about Sendable across the Objective-C frameworks this app links —
    # see the @preconcurrency note in ScreenCapture.swift, which keeps 6.0 buildable anyway.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test
